# ReviewMe — exemple de configuration.
#
# NB (prototype v0.2) : le runtime lit actuellement la configuration depuis .env
# (voir .env.example). Ce fichier TOML documente la config cible v2 (mapping
# multi-équipes repo -> pack de guidelines). Il n'est pas encore chargé par le code.

[github]
repo = "owner/repo"                # OWNER/REPO
token_env = "GITHUB_TOKEN"          # nom de la variable d'env portant le PAT (jamais le token en clair)

[review]
model = ""                          # vide = modèle par défaut de la CLI claude ; sinon ex. "claude-opus-4-8"
agent = ""                          # vide = persona auto-suffisant (config/prompts/system.md)
max_budget_usd = 10.0               # plafond de coût par review
confidence_threshold = 80           # findings sous ce seuil non postés
event = "COMMENT"                   # v1 : COMMENT uniquement (REQUEST_CHANGES = v2, identité dédiée)

[trigger]
mode = "label"                      # "label" (défaut) ou "all" (toute PR ouverte)
label = "review-me"                 # utilisé si mode = "label"
skip_drafts = true

# Mapping PR -> pack de guidelines (v2). Le pack pointe un dossier config/guidelines/<pack>/.
[[teams]]
match_repo = "owner/repo"
guidelines = "ios"

[[teams]]
match_repo = "*"
guidelines = "_default"
